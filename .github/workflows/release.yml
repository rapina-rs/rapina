name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly

      - name: Build
        run: cargo build --locked --release --all

      - name: Run tests
        run: cargo test --locked --all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v2
        continue-on-error: true
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly

      - name: Publish rapina-macros
        run: cargo publish -p rapina-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rapina
        run: cargo publish -p rapina --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rapina-cli
        run: cargo publish -p rapina-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
